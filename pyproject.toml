[project]
name = "laoma-bid-skills"
version = "0.1.0"
description = "投标文档处理技能集：8 个零大模型依赖的可组合技能（Word 排版 / 文档脱敏 / 报价核查 / 风险评分 / 规则筛查等）"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "老马标书贤内助" }]
keywords = [
  "招投标", "标书", "投标文件", "清标", "报价核查", "暗标", "Word 排版",
  "bidding", "tender", "procurement", "docx", "skill-engine",
  "document-processing", "chinese",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "python-docx>=1.1",
  "lxml>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/maning636/laoma-bid-skills"
Source = "https://github.com/maning636/laoma-bid-skills"
Issues = "https://github.com/maning636/laoma-bid-skills/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "skill_engine", "skills", "skills.docx_format", "skills.pricing_check",
  "skills.check_report_export", "skills.anon_bid_clean", "skills.risk_score",
  "skills.self_score", "skills.selfcheck_list", "utils",
  "rules_engine", "pathkit", "skills.rules_screen",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
